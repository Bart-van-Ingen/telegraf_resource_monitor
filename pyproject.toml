[tool.ruff]
line-length = 99

[tool.ruff.lint]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["D"] # Ignore docstring errors
"**/test/*" = ["D"] # Ignore docstring errors

[tool.ruff.format]
quote-style = "single"
