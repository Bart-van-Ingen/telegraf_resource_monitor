[project]
name = "telegraf-resource-monitor"
version = "0.0.0"
description = "Tooling and documentation for the telegraf_resource_monitor ROS 2 workspace."
requires-python = ">=3.10"

# Not a Python package, this pyproject only carries tooling config and dev
# dependency groups.
[tool.uv]
package = false

# Install with: uv sync --group docs
[dependency-groups]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.6.9",
]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["D"] # Ignore docstring errors
"**/test/*" = ["D"] # Ignore docstring errors

[tool.ruff.format]
quote-style = "single"
