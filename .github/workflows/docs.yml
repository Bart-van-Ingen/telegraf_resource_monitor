name: Documentation

# Builds the MkDocs site on every push to main, on pull requests, and on a manual
# run from any branch. Only main is published to GitHub Pages; every other run
# uploads the site as a downloadable artifact so you can preview it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch. Main is never cancelled mid-deploy, so a queued run cannot
# overwrite a newer site; branch builds are cancelled when you push again.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      # --locked fails the build if uv.lock is out of date with pyproject.toml.
      - name: Build the site
        run: uv run --locked --group docs mkdocs build

      # Downloadable from the run summary. Unzip it and open index.html.
      - name: Upload the site for preview
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site

      - name: Upload the site as a Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Only main publishes, so a manual run on a branch can never overwrite the
  # live site.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
