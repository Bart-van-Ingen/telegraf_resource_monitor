Hostname "collectd"
FQDNLookup false

Interval 0.2

LoadPlugin logfile

<Plugin logfile>
	LogLevel "info"
	File STDOUT
	Timestamp true
	PrintSeverity true
</Plugin>

LoadPlugin cpu
<Plugin cpu>
	ValuesPercentage True
	ReportByState True
	ReportByCpu True
</Plugin>

LoadPlugin df
<Plugin df>
  MountPoint "/"
  MountPoint "/hostfs"
  IgnoreSelected false
  LogOnce true
</Plugin>

LoadPlugin disk
<Plugin disk>
  Disk "/(loop)/"
  IgnoreSelected true
</Plugin>

LoadPlugin memory

LoadPlugin thermal

PluginDir "/ros_ws/build/collectd_socket_writer"
LoadPlugin collectd_socket_writer
<Plugin collectd_socket_writer>
  SocketPath "/tmp/telegraf.sock"
</Plugin>
